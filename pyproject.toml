[project]
name = "cloud-computing-project"
version = "0.1.0"
description = "Cloud Performance Monitoring with ML Insights - college mini project"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.34.0",
    "scikit-learn>=1.5.0",
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "matplotlib>=3.8.0",
    "streamlit>=1.36.0",
    "psutil>=5.9.0",
    "gputil>=1.4.0",
]

[dependency-groups]
dev = ["pytest>=8.0.0"]

[tool.uv]
# keep requirements.txt in sync with:  uv export --no-hashes -o requirements.txt
